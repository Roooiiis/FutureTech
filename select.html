<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="container" style="width: 100%; max-width: 400px">
    <div class="select field" data-js-select>
      <label for="phoneNumberPrefix" class="select__label" id="phoneNunberPrefixSelectLabel">
        Phone Number prefix
      </label>
      <select
        class="select__original-control field__control"
        id="phoneNumberPrefix"
        tabindex="-1"
        data-js-original-control
      >
        <option value="+7" selected>+7</option>
        <option value="+1">+1</option>
        <option value="+2">+2</option>
        <option value="+3">+3</option>
      </select>
      <div class="select__body">
        <div
          class="select__button field__control"
          tabindex="0"
          role="combobox"
          aria-expanded="false"
          aria-haspopup="listbox"
          aria-controls="phoneNumberPrefixSelectDropDown"
          aria-labelledby="phoneNunberPrefixSelectLabel"
          data-js-select-button
        >
          +7
        </div>
        <div
          class="select__drop-down"
          role="listbox"
          id="phoneNumberPrefixSelectDropDown"
          aria-labelledby="phoneNunberPrefixSelectLabel"
          data-js-select-drop-down
        >
          <div
            class="select__option"
            is-selected role="option"
            aria-selected="true"
            id="phoneNumberPrefixSelectOption1"
            data-js-select-option
          >
            +7
          </div>
          <div
            class="select__option"
            role="option"
            aria-selected="false"
            id="phoneNumberPrefixSelectOption2"
            data-js-select-option
          >
            +1
          </div>
          <div
            class="select__option"
            role="option"
            aria-selected="false"
            id="phoneNumberPrefixSelectOption3"
            data-js-select-option
          >
            +2
          </div>
          <div
            class="select__option"
            role="option"
            aria-selected="false"
            id="phoneNumberPrefixSelectOption4"
            data-js-select-option
          >
            +3
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
